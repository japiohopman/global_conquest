
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Global Conquest - New World Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bangers&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 0;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .bangers {
      font-family: 'Bangers', system-ui;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-x-180 { transform: rotateX(180deg); }

    /* Fire Animation Particles */
    @keyframes fire-rise {
      from { opacity: 0; transform: translateY(0) scale(1); }
      25% { opacity: 1; }
      to { opacity: 0; transform: translateY(-4em) scale(0); }
    }
    .fire-particle {
      animation: fire-rise 1s ease-in infinite;
      background-image: radial-gradient(#ff5000 30%, rgba(255,80,0,0) 70%);
      border-radius: 50%;
      mix-blend-mode: screen;
      position: absolute;
      bottom: 0;
      width: 20px;
      height: 20px;
    }
    .smog-particle {
      animation: fire-rise 2s ease-in infinite;
      background-image: radial-gradient(rgb(49, 48, 48) 30%, rgba(255,80,0,0) 70%);
      border-radius: 50%;
      mix-blend-mode: screen;
      position: absolute;
      bottom: 0;
      width: 30px;
      height: 30px;
    }

    @keyframes burn {
      0% { text-shadow: 0 0 0px transparent; color: #fff; }
      20% { text-shadow: 0 0 10px #f97316, 0 0 20px #ef4444; color: #fecaca; transform: scale(1.1); }
      100% { text-shadow: 0 0 0px transparent; color: #fff; }
    }
    .animate-burn { animation: burn 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

    @keyframes tactical-shake {
      0%, 100% { transform: translate(0, 0); }
      10%, 30%, 50%, 70%, 90% { transform: translate(-2px, -2px); }
      20%, 40%, 60%, 80% { transform: translate(2px, 2px); }
    }
    .animate-shake { animation: tactical-shake 0.4s ease-in-out; }

    @keyframes blink-elegant {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.6; filter: brightness(1.5) drop-shadow(0 0 12px rgba(255,255,255,0.3)); }
    }
    .animate-blink-elegant { animation: blink-elegant 3s ease-in-out infinite; }

    /* Tactical Vignette */
    .hud-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
      z-index: 100;
    }
    .hud-scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 3px 100%;
      z-index: 101;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "zustand": "https://esm.sh/zustand@4.5.2?deps=react@19.0.0",
    "zustand/middleware": "https://esm.sh/zustand@4.5.2/middleware?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0",
    "d3": "https://esm.sh/d3@7.9.0",
    "topojson-client": "https://esm.sh/topojson-client@3.1.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <div class="hud-vignette"></div>
  <div class="hud-scanlines"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
